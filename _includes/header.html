<!-- Header -->
<style>
    html {
        scroll-padding-top: 90px;
    }

    header.site-header {
        position: sticky;
        top: 0;
        z-index: 1000;
        padding: 12px 20px;
    }

    /* Logo */
    .site-header .logo a {
        display: flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        color: inherit;
    }

    .site-header .logo img {
        height: 56px;
        width: 56px;
        object-fit: cover;
        border-radius: 50%;
        transition: transform 0.3s;
    }

    .site-header .logo a:hover img {
        transform: scale(1.05);
    }

    .site-header .logo p {
        font-family: 'Lora', serif;
        font-size: 18px;
        line-height: 1.2;
    }

    /* Nav links */
    .site-header .nav ul {
        gap: 6px;
        padding-left: 20px;
    }

    .site-header .nav li>a:not([aria-label]) {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 16px;
        border-radius: 50px;
        font-size: 0.95rem;
        font-weight: 500;
        color: #333;
        transition: background-color 0.3s, color 0.3s;
    }

    .site-header .nav li>a:not([aria-label]):hover {
        background-color: rgba(255, 255, 255, 0.25);
        color: #1f3a2d;
    }

    .site-header .nav li>a i {
        font-size: 0.85em;
        opacity: 0.7;
    }

    /* Social icons */
    .site-header .social-links {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 0 10px;
    }

    .site-header .social-links a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        margin: 0;
        border-radius: 50%;
        border: 1px solid rgba(51, 51, 51, 0.35);
        font-size: 16px;
        transition: background-color 0.3s, border-color 0.3s, color 0.3s;
    }

    .site-header .social-links a:hover {
        background-color: rgba(255, 255, 255, 0.25);
        border-color: #1f3a2d;
        color: #1f3a2d;
    }

    /* Keyboard focus */
    .site-header a:focus-visible,
    .site-header .hamburger:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
    }

    /* Hamburger turns into an X when open */
    .hamburger.active .hamburger-inner {
        background-color: transparent;
    }

    .hamburger.active .hamburger-inner::before {
        transform: translateY(8px) rotate(45deg);
    }

    .hamburger.active .hamburger-inner::after {
        transform: translateY(-8px) rotate(-45deg);
    }

    /* Mobile menu */
    @media (max-width: 1000px) {
        .site-header .nav {
            padding: 8px 0 14px;
        }

        .site-header .nav ul {
            width: 100%;
            padding-left: 0;
            gap: 0;
        }

        .site-header .nav li {
            width: 100%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .site-header .nav li:last-child {
            border-bottom: none;
            padding: 14px 20px 0;
        }

        .site-header .nav li>a:not([aria-label]) {
            display: flex;
            width: 100%;
            padding: 14px 20px;
            border-radius: 0;
            font-size: 1rem;
        }

        .site-header .social-links {
            margin: 0;
        }
    }

    @media (max-width: 400px) {
        .site-header .logo p {
            font-size: 16px;
        }

        .site-header .logo img {
            height: 48px;
            width: 48px;
        }
    }
</style>

<header class="site-header">
    <div class="logo">
        <a href="/">
            <img src="/erins-pet-sitting-services.jpg" alt="Erin's Pet Sitting Services Logo">
            <p>Erin's Pet Sitting Services</p>
        </a>
    </div>

    <!-- Navigation -->
    <nav class="nav" aria-label="Main">
        <ul>
            <li><a href="/#services"><i class="fas fa-arrow-circle-right"></i>Our Services</a></li>
            <li><a href="/certificates-policies"><i class="fas fa-arrow-circle-right"></i>Certificates and Policies</a></li>
            <li><a href="/join"><i class="fas fa-arrow-circle-right"></i>Join Now!</a></li>
            <li>
                <div class="social-links">
                    <a href="{{ site.author.facebook }}" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
                    <a href="{{ site.author.messenger }}" aria-label="Messenger"><i class="fab fa-facebook-messenger"></i></a>
                    <a href="{{ site.author.whatsapp }}" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
                </div>
            </li>
        </ul>
    </nav>

    <!-- Hamburger Menu for Mobile -->
    <button class="hamburger" aria-label="Toggle navigation">
        <span class="hamburger-box">
            <span class="hamburger-inner"></span>
        </span>
    </button>
</header>
