<div id="notification-container"></div>
<script>
    const NotificationBanner = (() => {
    const container =
        document.getElementById("notification-container") ||
        (() => {
            const div = document.createElement("div");
            div.id = "notification-container";
            document.body.prepend(div);
            return div;
        })();

    const validTypes = ["info", "warning", "severe"];

    function addOrUpdate(id, message, type = "info") {
        if (!validTypes.includes(type)) {
            type = "info";
        }

        let banner = document.getElementById(`notification-${id}`);

        if (!banner) {
            banner = document.createElement("div");
            banner.id = `notification-${id}`;
            banner.className = `notification-banner notification-${type}`;

            const text = document.createElement("span");
            text.className = "notification-text";

            const closeBtn = document.createElement("button");
            closeBtn.className = "close-btn";
            closeBtn.innerHTML = "&times;";
            closeBtn.onclick = () => banner.remove();

            banner.appendChild(text);
            banner.appendChild(closeBtn);

            container.appendChild(banner);
        }

        banner.className = `notification-banner notification-${type}`;
        banner.querySelector(".notification-text").textContent = message;

        return banner;
    }

    function remove(id) {
        document.getElementById(`notification-${id}`)?.remove();
    }

    function clear() {
        container.innerHTML = "";
    }

    return {
        addOrUpdate,
        remove,
        clear,
    };
})();
</script>

}

</style>
