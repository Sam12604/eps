---
layout: default
---

<style>
    .markdown-body {
        padding: 20px;
        line-height: 1.5;
        word-wrap: break-word;
    }

    /* Headings */

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
        margin-top: 24px;
        margin-bottom: 16px;
        font-weight: 600;
        line-height: 1.25;
    }

    .markdown-body h1 {
        font-size: 2em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid #d0d7de;
    }

    .markdown-body h2 {
        font-size: 1.5em;
        padding-bottom: 0.3em;
        border-bottom: 1px solid #d0d7de;
    }

    .markdown-body h3 {
        font-size: 1.25em;
    }

    .markdown-body h4 {
        font-size: 1em;
    }

    .markdown-body h5 {
        font-size: 0.875em;
    }

    .markdown-body h6 {
        font-size: 0.85em;
        color: #656d76;
    }

    /* First heading / last heading spacing */

    .markdown-body> :first-child {
        margin-top: 0;
    }

    .markdown-body> :last-child {
        margin-bottom: 0;
    }

    /* Paragraphs */

    .markdown-body p {
        margin-top: 0;
        margin-bottom: 16px;
    }

    /* Links */

    .markdown-body a {
        color: #0969da;
        text-decoration: none;
    }

    .markdown-body a:hover {
        text-decoration: underline;
    }

    /* Bold / italic */

    .markdown-body strong {
        font-weight: 600;
    }

    /* Lists */

    .markdown-body ul,
    .markdown-body ol {
        margin-top: 0;
        margin-bottom: 16px;
        padding-left: 2em;
    }

    .markdown-body li {
        margin-top: 0.25em;
    }

    .markdown-body li>p {
        margin-top: 16px;
    }

    .markdown-body li+li {
        margin-top: 0.25em;
    }

    /* Nested lists */

    .markdown-body ul ul,
    .markdown-body ul ol,
    .markdown-body ol ul,
    .markdown-body ol ol {
        margin-top: 0;
        margin-bottom: 0;
    }

    /* Blockquotes */

    .markdown-body blockquote {
        margin: 0 0 16px;
        padding: 0 1em;
        color: #656d76;
        border-left: 0.25em solid #d0d7de;
    }

    .markdown-body blockquote> :first-child {
        margin-top: 0;
    }

    .markdown-body blockquote> :last-child {
        margin-bottom: 0;
    }

    /* Inline code */

    .markdown-body code,
    .markdown-body tt {
        padding: 0.2em 0.4em;
        margin: 0;
        font-size: 85%;
        white-space: break-spaces;
        background: #eff1f3;
        border-radius: 6px;
        font-family:
            ui-monospace,
            SFMono-Regular,
            SF Mono,
            Menlo,
            Consolas,
            "Liberation Mono",
            monospace;
    }

    /* Code blocks */

    .markdown-body pre {
        margin-top: 0;
        margin-bottom: 16px;
        padding: 16px;
        overflow: auto;
        font-size: 85%;
        line-height: 1.45;
        background: #f6f8fa;
        border-radius: 6px;
    }

    .markdown-body pre code {
        padding: 0;
        margin: 0;
        font-size: 100%;
        white-space: pre;
        background: transparent;
        border: 0;
    }

    /* Horizontal rules */

    .markdown-body hr {
        height: 0;
        margin: 24px 0;
        overflow: hidden;
        background: transparent;
        border: 0;
        border-bottom: 1px solid #d0d7de;
    }

    /* Images */

    .markdown-body img {
        max-width: 100%;
        height: auto;
        box-sizing: content-box;
        border-radius: 6px;
    }

    /* Tables */

    .markdown-body table {
        display: block;
        width: max-content;
        max-width: 100%;
        margin-bottom: 16px;
        overflow: auto;
        border-spacing: 0;
        border-collapse: collapse;
    }

    .markdown-body table th,
    .markdown-body table td {
        padding: 6px 13px;
        border: 1px solid #d0d7de;
    }

    .markdown-body table th {
        font-weight: 600;
        background: #f6f8fa;
    }

    .markdown-body table tr {
        background: white;
        border-top: 1px solid #d8dee4;
    }

    .markdown-body table tr:nth-child(2n) {
        background: #f6f8fa;
    }

    /* Definition / task-list style checkboxes */

    .markdown-body input[type="checkbox"] {
        margin: 0 0.35em 0.25em -1.6em;
        vertical-align: middle;
    }

    .markdown-body ul:has(> li > input[type="checkbox"]) {
        list-style: none;
        padding-left: 1.6em;
    }

    /* Keyboard input */

    .markdown-body kbd {
        display: inline-block;
        padding: 0.15em 0.4em;
        font-family:
            ui-monospace,
            SFMono-Regular,
            SF Mono,
            Menlo,
            Consolas,
            "Liberation Mono",
            monospace;
        font-size: 11px;
        line-height: 10px;
        color: #25292e;
        vertical-align: middle;
        background: #f6f8fa;
        border: 1px solid #d1d9e0;
        border-bottom-color: #afb8c1;
        border-radius: 6px;
        box-shadow: inset 0 -1px 0 #afb8c1;
    }

    /* Sup / sub */

    .markdown-body sup,
    .markdown-body sub {
        font-size: 75%;
        line-height: 0;
        position: relative;
        vertical-align: baseline;
    }

    .markdown-body sup {
        top: -0.5em;
    }

    .markdown-body sub {
        bottom: -0.25em;
    }

    /* Details / summary */

    .markdown-body details {
        margin-bottom: 16px;
    }

    .markdown-body summary {
        cursor: pointer;
        font-weight: 600;
    }

    /* Responsive tables / long content */

    .markdown-body pre,
    .markdown-body table {
        max-width: 100%;
    }

    .markdown-body pre {
        overflow-x: auto;
    }

    /* Mobile */

    @media (max-width: 767px) {
        .markdown-body {
            font-size: 16px;
        }

        .markdown-body h1 {
            font-size: 1.75em;
        }

        .markdown-body h2 {
            font-size: 1.4em;
        }

        .markdown-body h3 {
            font-size: 1.2em;
        }

        .markdown-body pre {
            padding: 12px;
            border-radius: 4px;
        }

        .markdown-body table {
            font-size: 14px;
        }
    }

    @media print {
        body * {
            visibility: hidden;
        }

        .markdown-body * {
            visibility: visible;
        }

        .markdown-body {
            position: absolute;
            left: 0;
            top: 0;
        }
    }
</style>
<main class="markdown-body">{{ content }}</main>
